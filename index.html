<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:url("2357.jpg") center center/cover no-repeat;
height:100vh;
overflow:hidden;
position:relative;
}

body::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
left:0;
top:0;
}

.center{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);
text-align:center;
color:white;
z-index:100;
}

.shirt{
display:inline-block;
padding:15px 40px;
font-size:60px;
font-weight:bold;
border:3px solid white;
border-radius:20px;
background:rgba(255,255,255,.2);
backdrop-filter:blur(8px);
animation:zoom 1s infinite alternate;
}

@keyframes zoom{
from{transform:scale(1);}
to{transform:scale(1.15);}
}

h1{
margin-top:30px;
font-size:60px;
animation:glow 2s infinite;
}

@keyframes glow{
50%{
text-shadow:
0 0 15px white,
0 0 30px yellow,
0 0 50px orange;
}
}

p{
margin-top:15px;
font-size:28px;
}

.balloon{
position:absolute;
bottom:-120px;
font-size:60px;
animation:float linear infinite;
}

@keyframes float{
from{transform:translateY(0);}
to{transform:translateY(-120vh);}
}

canvas{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
pointer-events:none;
}
</style>

</head>

<body>

<div class="center">

<div class="shirt">
HBD
</div>

<h1>🎉 HAPPY BIRTHDAY 🎉</h1>

<p> HBD ตื้อโป้ยก่าย  🎂</p>

</div>

<canvas id="canvas"></canvas>

<script>

// ลูกโป่ง
function balloon(){

let b=document.createElement("div");

b.className="balloon";

let icon=["🎈","🎉","⭐","❤️","🎁","✨"];

b.innerHTML=icon[Math.floor(Math.random()*icon.length)];

b.style.left=Math.random()*100+"vw";

b.style.animationDuration=(4+Math.random()*5)+"s";

document.body.appendChild(b);

setTimeout(()=>{
b.remove();
},9000);

}

setInterval(balloon,500);

// พลุ
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let particles=[];

function firework(){

let x=Math.random()*canvas.width;
let y=Math.random()*canvas.height/2;

for(let i=0;i<80;i++){

particles.push({

x:x,
y:y,

dx:(Math.random()-0.5)*8,
dy:(Math.random()-0.5)*8,

life:80,

color:`hsl(${Math.random()*360},100%,60%)`

});

}

}

setInterval(firework,900);

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=particles.length-1;i>=0;i--){

let p=particles[i];

ctx.beginPath();

ctx.arc(p.x,p.y,3,0,Math.PI*2);

ctx.fillStyle=p.color;

ctx.fill();

p.x+=p.dx;
p.y+=p.dy;

p.life--;

if(p.life<=0){

particles.splice(i,1);

}

}

requestAnimationFrame(animate);

}

animate();

window.onresize=function(){

canvas.width=innerWidth;
canvas.height=innerHeight;

}

</script>

</body>
</html>
